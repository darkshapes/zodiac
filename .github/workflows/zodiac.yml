
# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: zodiac pytest

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get -y install libportaudio2 ffmpeg build-essential pkg-config libcairo2-dev libgirepository-2.0 python3-gi python3-gi-cairo gir1.2-gtk-4.0
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Set up Python (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Create venv & install deps
        run: |
          python -m venv $HOME/.venv
          source $HOME/.venv/bin/activate
          python -m pip install --upgrade pip
          pip install --no-cache-dir ".[dev]"

      - name: Run tests
        env:
          HF_HOME: ${{ runner.temp }}/hf_cache
        run: |
          source $HOME/.venv/bin/activate
          cd tests
          pytest -v

      - name: Clean up caches (optional, just to be safe)
        if: always()
        run: |
          rm -rf $HOME/.cache/pip $HF_HOME $RUNNER_TEMP/*
